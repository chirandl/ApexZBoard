name: Android build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with: { name: ApexZBoard-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Release tagged APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: app/build/outputs/apk/debug/app-debug.apk }
